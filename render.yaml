services:
  - type: web
    name: enterprise-hrms-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      # Secrets — set these in the Render dashboard, do not commit real values.
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      # Business timezone for attendance/leave day boundaries (IANA name).
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info
      # Frontend origin(s) allowed to call this API with credentials.
      - key: CLIENT_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Optional integrations — leave REDIS_ENABLED/EMAIL_ENABLED false to
      # run without them; the app degrades gracefully either way.
      - key: REDIS_ENABLED
        value: 'false'
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: EMAIL_ENABLED
        value: 'false'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
